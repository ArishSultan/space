id: s3
name: S3 Storage
icon: externaldrive.fill
logo: s3.png
color: "#F2994A"
# S3-compatible object storage: Versity S3 Gateway serving a plain directory (one folder per bucket).
# No config file: everything is set through environment variables.
image: versity/versitygw:latest
ports:
  - { name: s3, container: 9000, host: 9000 }
volumes:
  - { name: data, path: /data }
env:
  VGW_BACKEND: posix
  VGW_BACKEND_ARG: /data
  VGW_PORT: ":9000"
  VGW_HEALTH: /health
  ROOT_ACCESS_KEY: spaceadmin
  ROOT_SECRET_KEY: spaceadmin
memory: 512M
cpus: 1
health:
  exec: [wget, -q, -O, /dev/null, "http://localhost:9000/health"]
connection:
  endpoint: http://localhost:{port.s3}
  access_key: spaceadmin
  secret_key: spaceadmin
  region: us-east-1
# The gateway image has no bucket CLI, so bucket actions run Amazon's aws-cli in a throwaway container.
actions:
  create_bucket:
    description: Create a bucket
    params: [name]
    image: amazon/aws-cli:latest
    env: &aws
      AWS_ACCESS_KEY_ID: spaceadmin
      AWS_SECRET_ACCESS_KEY: spaceadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://{address}:9000
    exec: [s3api, create-bucket, --bucket, "{name}"]
  drop_bucket:
    description: Delete a bucket and everything in it
    params: [name]
    image: amazon/aws-cli:latest
    env: *aws
    exec: [s3, rb, "s3://{name}", --force]
  list_buckets:
    description: List buckets
    image: amazon/aws-cli:latest
    env: *aws
    exec: [s3api, list-buckets, --query, "Buckets[].Name", --output, text]
resources:
  - id: buckets
    kind: bucket
    title: Buckets
    hint: "Use endpoint http://localhost:9000 with access key / secret key spaceadmin. Bucket names: lowercase letters, digits and hyphens."
    list: list_buckets
    create: create_bucket
    drop: drop_bucket
    connection: http://localhost:{port.s3}/{name}
    env:
      S3_ENDPOINT: http://localhost:{port.s3}
      S3_BUCKET: "{name}"
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: spaceadmin
      S3_SECRET_ACCESS_KEY: spaceadmin
      S3_FORCE_PATH_STYLE: "true"
