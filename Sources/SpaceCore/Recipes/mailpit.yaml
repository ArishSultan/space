id: mailpit
name: Mailpit
icon: envelope.fill
logo: mailpit.png
color: "#0EA5A4"
image: axllent/mailpit:latest
ports:
  - { name: smtp, container: 1025, host: 1025 }
  - { name: http, container: 8025, host: 8025 }
volumes:
  - { name: data, path: /data }
env:
  MP_DATABASE: /data/mailpit.db
  MP_SMTP_AUTH_ACCEPT_ANY: "true"
  MP_SMTP_AUTH_ALLOW_INSECURE: "true"
memory: 256M
cpus: 1
health:
  exec: [/mailpit, readyz]
adminURL: http://localhost:{port.http}
connection:
  smtp: smtp://localhost:{port.smtp}
  api: http://localhost:{port.http}/api/v1
actions:
  recent:
    description: Latest 25 messages
    http: { url: "http://localhost:{port.http}/api/v1/messages?limit=25" }
    extract: "messages[].{ID}  {Created}  {From.Address} → {To} — {Subject}"
  search:
    description: Search messages (Mailpit search syntax, e.g. to:user@x.com subject:welcome)
    params: [query]
    text: [query]
    http: { url: "http://localhost:{port.http}/api/v1/search?query={query}&limit=25" }
    extract: "messages[].{ID}  {Created}  {From.Address} → {To} — {Subject}"
  message:
    description: One message as JSON (headers, text and HTML body)
    hidden: true
    params: [id]
    http: { url: "http://localhost:{port.http}/api/v1/message/{id}" }
  clear:
    description: Delete all messages
    http: { method: DELETE, url: "http://localhost:{port.http}/api/v1/messages" }
projectEnv:
  SMTP_HOST: localhost
  SMTP_PORT: "{port.smtp}"
  SMTP_URL: smtp://localhost:{port.smtp}
