id: mongodb
name: MongoDB
icon: leaf.fill
logo: mongodb.png
color: "#00ED64"
image: mongo:latest
ports:
  - { name: mongo, container: 27017, host: 27017 }
volumes:
  - { name: data, path: /data/db }
env:
  MONGO_INITDB_ROOT_USERNAME: space
  MONGO_INITDB_ROOT_PASSWORD: space
memory: 1G
cpus: 2
health:
  # Authenticated ping: during first start the image runs a temporary server before the admin user exists.
  exec: [mongosh, -u, space, -p, space, --authenticationDatabase, admin, --quiet, --eval, "db.adminCommand('ping').ok"]
connection:
  url: mongodb://space:space@localhost:{port.mongo}/?authSource=admin
actions:
  backup:
    description: Pin the feature compatibility version and dump everything into the data volume
    hidden: true
    exec: [sh, -c, 'mongosh -u space -p space --authenticationDatabase admin --quiet --eval "const v = db.version().split(\".\").slice(0, 2).join(\".\"); db.adminCommand({setFeatureCompatibilityVersion: v, confirm: true})" >/dev/null && mkdir -p /data/db/space-backups && f=/data/db/space-backups/$(date +%Y%m%d-%H%M%S).archive.gz && mongodump -u space -p space --authenticationDatabase admin --gzip --archive=$f --quiet && echo $f']
  restore_latest_backup:
    description: Restore the newest backup (replaces current data)
    exec: [sh, -c, 'f=$(ls -1t /data/db/space-backups/*.archive.gz | head -1) && mongorestore -u space -p space --authenticationDatabase admin --gzip --archive=$f --drop --quiet && echo restored $f']
  create_project:
    description: Create a project (database + user with the same name, password = name)
    params: [name]
    exec: [mongosh, -u, space, -p, space, --authenticationDatabase, admin, --quiet, --eval,
           'const d = db.getSiblingDB("{name}"); d.createUser({user: "{name}", pwd: "{name}", roles: [{role: "dbOwner", db: "{name}"}]}); d.getCollection("_space").insertOne({createdAt: new Date()}); print("created")']
  drop_project:
    description: Delete a project's database and user
    params: [name]
    exec: [mongosh, -u, space, -p, space, --authenticationDatabase, admin, --quiet, --eval,
           'const d = db.getSiblingDB("{name}"); try { d.dropUser("{name}") } catch (e) {}; d.dropDatabase(); print("dropped")']
  list_projects:
    description: List projects (users named after their own database)
    exec: [mongosh, -u, space, -p, space, --authenticationDatabase, admin, --quiet, --eval,
           'db.getSiblingDB("admin").system.users.find({$expr: {$eq: ["$user", "$db"]}}).forEach(u => print(u.user))']
  create_db:
    description: Create a database
    params: [name]
    exec: [mongosh, -u, space, -p, space, --authenticationDatabase, admin, --quiet, --eval,
           'db.getSiblingDB("{name}").getCollection("_space").insertOne({createdAt: new Date()}); print("created")']
  drop_db:
    description: Drop a database
    params: [name]
    exec: [mongosh, -u, space, -p, space, --authenticationDatabase, admin, --quiet, --eval,
           'db.getSiblingDB("{name}").dropDatabase(); print("dropped")']
  list_dbs:
    description: List databases
    exec: [mongosh, -u, space, -p, space, --authenticationDatabase, admin, --quiet, --eval,
           'db.adminCommand({listDatabases: 1}).databases.forEach(d => print(d.name))']
resources:
  - id: projects
    kind: project
    title: Projects
    hint: A database and a user with the same name (password = name).
    list: list_projects
    create: create_project
    drop: drop_project
    connection: mongodb://{name}:{name}@localhost:{port.mongo}/{name}
  - id: databases
    kind: database
    title: Databases
    list: list_dbs
    create: create_db
    drop: drop_db
    protected: [admin, config, local]
    connection: mongodb://space:space@localhost:{port.mongo}/{name}?authSource=admin
beforeUpdate: [backup]
projectResource: projects
projectEnv:
  MONGODB_URI: mongodb://{name}:{name}@localhost:{port.mongo}/{name}
