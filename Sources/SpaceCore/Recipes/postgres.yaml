id: postgres
name: PostgreSQL
icon: cylinder.split.1x2.fill
logo: postgres.png
color: "#336791"
# pgautoupgrade tracks the latest Postgres and upgrades old data directories in place.
image: pgautoupgrade/pgautoupgrade:latest
ports:
  - { name: pg, container: 5432, host: 5432 }
volumes:
  - { name: data, path: /var/lib/postgresql/data }
env:
  POSTGRES_USER: space
  POSTGRES_PASSWORD: space
  # Subdirectory: volumes are ext4 images with lost+found at the root.
  PGDATA: /var/lib/postgresql/data/pgdata
memory: 1G
cpus: 2
health:
  exec: [pg_isready, -U, space]
connection:
  url: postgres://space:space@localhost:{port.pg}/postgres
clients: list_clients
actions:
  backup:
    description: Dump all databases into the data volume (kept in space-backups/)
    hidden: true
    exec: [sh, -c, 'mkdir -p /var/lib/postgresql/data/space-backups && f=/var/lib/postgresql/data/space-backups/$(date +%Y%m%d-%H%M%S).sql.gz && pg_dumpall -U space | gzip > $f && echo $f']
  list_clients:
    description: Connected clients (excludes Space's own local-socket queries)
    exec: [psql, -U, space, -d, postgres, -At, -c,
           "SELECT coalesce(nullif(application_name, ''), 'client') || ' — ' || usename || '@' || datname || ' from ' || host(client_addr) FROM pg_stat_activity WHERE backend_type = 'client backend' AND client_addr IS NOT NULL AND pid <> pg_backend_pid() ORDER BY 1"]
  # Database + user: a login role + a database it owns, both with the same name (password = name; local dev only).
  create_dbuser:
    description: Create a database and a user with the same name
    params: [name]
    exec: [psql, -U, space, -d, postgres, -v, ON_ERROR_STOP=1,
           -c, "CREATE ROLE \"{name}\" LOGIN CREATEDB PASSWORD '{name}'",
           -c, 'CREATE DATABASE "{name}" OWNER "{name}"']
  drop_dbuser:
    description: Delete a database + user pair
    params: [name]
    exec: [psql, -U, space, -d, postgres, -v, ON_ERROR_STOP=1,
           -c, 'DROP DATABASE IF EXISTS "{name}" WITH (FORCE)',
           -c, 'DROP ROLE IF EXISTS "{name}"']
  list_dbusers:
    description: List database + user pairs (databases owned by a role with the same name)
    exec: [psql, -U, space, -d, postgres, -At, -c,
           "SELECT d.datname FROM pg_database d JOIN pg_roles r ON r.oid = d.datdba WHERE r.rolname = d.datname AND r.rolname <> 'space' ORDER BY 1"]
  create_db:
    description: Create a database (owned by the default user)
    params: [name]
    exec: [psql, -U, space, -d, postgres, -v, ON_ERROR_STOP=1, -c, 'CREATE DATABASE "{name}"']
  drop_db:
    description: Drop a database
    params: [name]
    exec: [psql, -U, space, -d, postgres, -v, ON_ERROR_STOP=1, -c, 'DROP DATABASE IF EXISTS "{name}" WITH (FORCE)']
  list_dbs:
    description: List databases
    exec: [psql, -U, space, -d, postgres, -At, -c, 'SELECT datname FROM pg_database WHERE NOT datistemplate ORDER BY 1']
  create_user:
    description: Create a login user (password = name)
    params: [name]
    exec: [psql, -U, space, -d, postgres, -v, ON_ERROR_STOP=1, -c, "CREATE ROLE \"{name}\" LOGIN CREATEDB PASSWORD '{name}'"]
  drop_user:
    description: Drop a user
    params: [name]
    exec: [psql, -U, space, -d, postgres, -v, ON_ERROR_STOP=1, -c, 'DROP ROLE IF EXISTS "{name}"']
  list_users:
    description: List login users
    exec: [psql, -U, space, -d, postgres, -At, -c, "SELECT rolname FROM pg_roles WHERE rolcanlogin AND rolname NOT LIKE 'pg\\_%' ORDER BY 1"]
resources:
  - id: dbusers
    kind: "database & user"
    title: Database + user
    hint: A user and a database with the same name — the quickest way to give an app its own database.
    list: list_dbusers
    create: create_dbuser
    drop: drop_dbuser
    connection: postgres://{name}:{name}@localhost:{port.pg}/{name}
    env:
      DATABASE_URL: postgres://{name}:{name}@localhost:{port.pg}/{name}
  - id: databases
    kind: database
    title: Databases
    list: list_dbs
    create: create_db
    drop: drop_db
    protected: [postgres, space]
    connection: postgres://space:space@localhost:{port.pg}/{name}
    env:
      DATABASE_URL: postgres://space:space@localhost:{port.pg}/{name}
  - id: users
    kind: user
    title: Users
    hint: Password is the same as the user name.
    list: list_users
    create: create_user
    drop: drop_user
    protected: [space]
    connection: postgres://{name}:{name}@localhost:{port.pg}/postgres
beforeUpdate: [backup]
